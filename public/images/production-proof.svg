<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">Production proof checklist</title>
  <desc id="desc">A dark business interface showing proof, governance, and launch readiness before production.</desc>
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#103c2f"/>
      <stop offset="1" stop-color="#17c98d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="900" height="760" rx="48" fill="#050505"/>
  <text x="450" y="108" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="850" fill="#fff">Proof before production</text>
  <g filter="url(#shadow)">
    <rect x="206" y="168" width="488" height="430" rx="44" fill="#0d100e" stroke="#fff" stroke-opacity=".1"/>
    <path d="M450 210 520 250v80c0 72-36 126-70 148-34-22-70-76-70-148v-80Z" fill="url(#green)"/>
    <path d="m425 328 21 22 42-58" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="450" y="425" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="900" fill="#fff">Ready to test</text>
    <text x="450" y="462" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="750" fill="#fff" opacity=".58">not yet production</text>
    <g font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850">
      <rect x="250" y="508" width="400" height="48" rx="16" fill="#fff" fill-opacity=".08"/>
      <text x="282" y="539" fill="#fff">Evidence reviewed</text>
      <text x="622" y="539" text-anchor="end" fill="#dfff42">done</text>
      <rect x="250" y="568" width="400" height="48" rx="16" fill="#fff" fill-opacity=".08"/>
      <text x="282" y="599" fill="#fff">Governance mapped</text>
      <text x="622" y="599" text-anchor="end" fill="#dfff42">done</text>
    </g>
  </g>
</svg>
