<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">Business workflow task cards</title>
  <desc id="desc">A dark task interface with business workflow cards for review, data mapping, and decision briefing.</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a54"/>
      <stop offset="0.55" stop-color="#ffd63d"/>
      <stop offset="1" stop-color="#dfff42"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39a6d9"/>
      <stop offset="1" stop-color="#d8f1ff"/>
    </linearGradient>
    <linearGradient id="plum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#332032"/>
      <stop offset="1" stop-color="#7e3248"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="34" stdDeviation="26" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="900" height="760" rx="48" fill="#050505"/>
  <circle cx="94" cy="93" r="51" fill="#363636" stroke="#5a5a5a" stroke-width="4"/>
  <path d="M110 66 83 93l27 27" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="806" cy="93" r="51" fill="#363636" stroke="#5a5a5a" stroke-width="4"/>
  <path d="M806 65v56M778 93h56" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>

  <text x="450" y="112" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="800" fill="#fff">Workflow</text>

  <g filter="url(#shadow)">
    <g transform="translate(12 240) rotate(-10)">
      <rect width="324" height="344" rx="35" fill="url(#plum)"/>
      <path d="M0 0h324v146c-68 18-152 16-229-4C54 132 21 128 0 135Z" fill="#d7b64a" opacity=".95"/>
      <rect x="26" y="30" width="112" height="36" rx="18" fill="#fff" opacity=".92"/>
      <text x="82" y="55" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#777">2 days</text>
      <text x="28" y="226" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff" opacity=".62">Next step</text>
      <text x="28" y="269" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#fff">Data mapping</text>
    </g>

    <g transform="translate(564 240) rotate(8)">
      <rect width="324" height="344" rx="35" fill="url(#blue)"/>
      <path d="M0 0h324v143c-58 14-126 11-203-6C64 125 26 136 0 152Z" fill="#34a8d8" opacity=".92"/>
      <rect x="24" y="30" width="118" height="36" rx="18" fill="#fff" opacity=".92"/>
      <text x="83" y="55" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#777">5 days</text>
      <text x="28" y="226" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1e5f74" opacity=".7">Next step</text>
      <text x="28" y="269" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900" fill="#050505">Data preparation</text>
    </g>

    <g transform="translate(270 208)">
      <rect width="370" height="360" rx="38" fill="url(#orange)"/>
      <path d="M0 0h370v157c-62 18-147 16-222-1C83 141 34 149 0 169Z" fill="#ffb347" opacity=".9"/>
      <rect x="52" y="44" width="148" height="45" rx="23" fill="#fff" opacity=".94"/>
      <text x="126" y="74" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#777">1 day</text>
      <text x="52" y="238" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#5f5a00" opacity=".72">First step</text>
      <text x="52" y="284" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#050505">Business case</text>
    </g>
  </g>

  <g transform="translate(282 632)" opacity=".55">
    <path d="M28 70a170 170 0 0 1 340 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="18 24"/>
    <text x="198" y="86" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="900" fill="#fff">8:00</text>
  </g>
</svg>
