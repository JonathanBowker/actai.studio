<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">Trusted agent boundaries</title>
  <desc id="desc">A dark interface showing a trusted agent with limits, evidence, and human review.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#8a6a2e"/>
      <stop offset=".48" stop-color="#332417"/>
      <stop offset="1" stop-color="#080908"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="900" height="760" rx="48" fill="#050505"/>
  <text x="450" y="108" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="850" fill="#fff">Trust boundary</text>
  <g filter="url(#shadow)">
    <rect x="210" y="165" width="480" height="430" rx="44" fill="url(#glow)" stroke="#fff" stroke-opacity=".1"/>
    <circle cx="450" cy="345" r="122" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="4"/>
    <circle cx="450" cy="345" r="88" fill="#8a6a2e" fill-opacity=".65" stroke="#dfff42" stroke-opacity=".28"/>
    <path d="M450 217a128 128 0 0 1 113 188" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
    <path d="M342 409a128 128 0 0 1 8-139" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".75"/>
    <circle cx="342" cy="409" r="13" fill="#fff"/>
    <text x="450" y="361" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="900" fill="#fff">Human</text>
    <text x="450" y="397" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="900" fill="#fff">review</text>
    <rect x="250" y="493" width="118" height="52" rx="18" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".14"/>
    <text x="309" y="526" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850" fill="#fff">Limits</text>
    <rect x="391" y="493" width="118" height="52" rx="18" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".14"/>
    <text x="450" y="526" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850" fill="#fff">Evidence</text>
    <rect x="532" y="493" width="118" height="52" rx="18" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".14"/>
    <text x="591" y="526" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850" fill="#fff">Escalate</text>
  </g>
</svg>
