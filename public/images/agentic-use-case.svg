<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">Agentic use case canvas</title>
  <desc id="desc">A dark business interface showing a realistic agentic use case with task, boundary, data, and owner.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#292d24"/>
      <stop offset="1" stop-color="#0c120f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a54"/>
      <stop offset="1" stop-color="#dfff42"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="900" height="760" rx="48" fill="#050505"/>
  <text x="450" y="110" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="850" fill="#fff">Use case</text>
  <g filter="url(#shadow)">
    <rect x="120" y="170" width="660" height="440" rx="38" fill="url(#panel)" stroke="#fff" stroke-opacity=".12"/>
    <rect x="168" y="222" width="236" height="92" rx="22" fill="#fff" fill-opacity=".1"/>
    <rect x="168" y="338" width="236" height="92" rx="22" fill="#fff" fill-opacity=".1"/>
    <rect x="168" y="454" width="236" height="92" rx="22" fill="#fff" fill-opacity=".1"/>
    <rect x="456" y="222" width="276" height="324" rx="28" fill="url(#accent)"/>
    <text x="196" y="255" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#fff" opacity=".58">Task</text>
    <text x="196" y="287" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="850" fill="#fff">Review inbound briefs</text>
    <text x="196" y="371" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#fff" opacity=".58">Boundary</text>
    <text x="196" y="403" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="850" fill="#fff">Suggest, don't decide</text>
    <text x="196" y="487" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#fff" opacity=".58">Owner</text>
    <text x="196" y="519" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="850" fill="#fff">Ops director</text>
    <text x="496" y="283" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800" fill="#5f5a00" opacity=".78">Agent job</text>
    <text x="496" y="337" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="900" fill="#050505">Triage</text>
    <text x="496" y="382" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="900" fill="#050505">requests</text>
    <rect x="496" y="444" width="188" height="52" rx="16" fill="#050505" fill-opacity=".82"/>
    <text x="590" y="477" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff">ready to test</text>
  </g>
</svg>
